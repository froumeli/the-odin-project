<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">Rock Paper Scissors</div>
    <div class="text">Are you ready to beat the computer?</div>
    <div class="container">
        <hr>
        <div class="score"><div class="human">0</div>:<div class="computer">0</div></div>
        <hr>
        <div class="buttons">
            <div class="rock">
                <button>
                    <img src="./img/rock.png" alt="Rock">
                </button>
                <div>Rock</div>
            </div>
            <div class="paper">
                <button>
                    <img src="./img/paper.png" alt="Paper">
                </button>
                <div>Paper</div>
            </div>
            <div class="scissors">
                <button>
                    <img src="./img/scissors.jpg" alt="Scissors">
                </button>
                <div>Scissors</div>
            </div>
        </div>
        <hr>
        <div class="compChoice">
            <div class="img"></div>
            <div class="choice">Computer Choice:</div>
            <div>Scissors</div>
        </div>
        <hr>
        <div class="result">Result:</div>
    </div>
    <div class="footer">Devable &copy;</div>
</body>
</html>
